# Blueprint de Render: New → Blueprint → elige este repo.
# Las variables con `sync: false` se piden al crear el servicio (no se guardan en el repo).
services:
  - type: web
    name: corcho-api
    runtime: node
    plan: free
    region: ohio # cerca del pooler de Supabase (us-east-2)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_HOST
        value: aws-0-us-east-2.pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_SSL
        value: 'true'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRA
        value: 7d
      # URL de Vercel del frontend (sin / al final); varias separadas por comas
      - key: CORS_ORIGEN
        sync: false
      - key: URL_FRONTEND
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: INTEGRACION_TOKEN
        generateValue: true
      # Webhook del flujo de n8n que manda los correos, y su token (X-Correos-Token)
      # Pagos con tarjeta (Stripe Connect): sk_test_… para probar, sk_live_… en real; whsec_… del webhook a /pasarela/stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: N8N_CORREOS_URL
        sync: false
      - key: N8N_CORREOS_TOKEN
        sync: false
